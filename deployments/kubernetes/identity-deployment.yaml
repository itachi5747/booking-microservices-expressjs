apiVersion: apps/v1
kind: Deployment
metadata:
  name: identity
  namespace: booking
spec:
  replicas: 1
  selector:
    matchLabels:
      app: identity
  template:
    metadata:
      labels:
        app: identity
    spec:
      containers:
        - name: identity
          image: booking-microservices-expressjs-identity:latest
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: booking-config
            - secretRef:
                name: booking-secret
          env:
            - name: PORT
              valueFrom:
                configMapKeyRef:
                  name: booking-config
                  key: IDENTITY_PORT
            - name: SERVICE_NAME
              valueFrom:
                configMapKeyRef:
                  name: booking-config
                  key: IDENTITY_SERVICE_NAME
            - name: POSTGRES_Database
              valueFrom:
                configMapKeyRef:
                  name: booking-config
                  key: POSTGRES_DB
            - name: RABBITMQ_EXCHANGE
              valueFrom:
                configMapKeyRef:
                  name: booking-config
                  key: IDENTITY_RABBITMQ_EXCHANGE
            - name: OPEN_TELEMETRY_SERVICE_NAME
              valueFrom:
                configMapKeyRef:
                  name: booking-config
                  key: IDENTITY_OTEL_SERVICE_NAME
          ports:
            - containerPort: 3333
              name: http
          startupProbe:
            httpGet:
              path: /
              port: 3333
            failureThreshold: 30
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /
              port: 3333
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            httpGet:
              path: /
              port: 3333
            initialDelaySeconds: 30
            periodSeconds: 20
            timeoutSeconds: 5
