apiVersion: apps/v1
kind: Deployment
metadata:
  name: booking
  namespace: booking
spec:
  replicas: 1
  selector:
    matchLabels:
      app: booking
  template:
    metadata:
      labels:
        app: booking
    spec:
      containers:
        - name: booking
          # image: booking-microservices-expressjs-booking:latest
          image : booking-service:latest 
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: booking-config
            - secretRef:
                name: booking-secret
          env:
            - name: PORT
              valueFrom:
                configMapKeyRef:
                  name: booking-config
                  key: BOOKING_PORT
            - name: SERVICE_NAME
              valueFrom:
                configMapKeyRef:
                  name: booking-config
                  key: BOOKING_SERVICE_NAME
            - name: POSTGRES_Database
              valueFrom:
                configMapKeyRef:
                  name: booking-config
                  key: POSTGRES_DB
            - name: RABBITMQ_EXCHANGE
              valueFrom:
                configMapKeyRef:
                  name: booking-config
                  key: BOOKING_RABBITMQ_EXCHANGE
            - name: OPEN_TELEMETRY_SERVICE_NAME
              valueFrom:
                configMapKeyRef:
                  name: booking-config
                  key: BOOKING_OTEL_SERVICE_NAME
          ports:
            - containerPort: 3366
              name: http
          startupProbe:
            httpGet:
              path: /
              port: 3366
            failureThreshold: 30
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /
              port: 3366
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            httpGet:
              path: /
              port: 3366
            initialDelaySeconds: 30
            periodSeconds: 20
            timeoutSeconds: 5
