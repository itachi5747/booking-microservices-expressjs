apiVersion: v1
kind: Service
metadata:
  name: otel-collector
  namespace: booking
spec:
  type: ClusterIP
  selector:
    app: otel-collector
  ports:
    - name: grpc
      port: 4319
      targetPort: 4319
      protocol: TCP
    - name: http
      port: 4320
      targetPort: 4320
      protocol: TCP
