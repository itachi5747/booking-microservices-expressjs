apiVersion: apps/v1
kind: Deployment
metadata:
  name: flight
  namespace: booking
spec:
  replicas: 1
  selector:
    matchLabels:
      app: flight
  template:
    metadata:
      labels:
        app: flight
    spec:
      containers:
        - name: flight
          image: booking-microservices-expressjs-flight:latest
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: booking-config
            - secretRef:
                name: booking-secret
          env:
            - name: PORT
              valueFrom:
                configMapKeyRef:
                  name: booking-config
                  key: FLIGHT_PORT
            - name: SERVICE_NAME
              valueFrom:
                configMapKeyRef:
                  name: booking-config
                  key: FLIGHT_SERVICE_NAME
            - name: POSTGRES_Database
              valueFrom:
                configMapKeyRef:
                  name: booking-config
                  key: POSTGRES_DB
            - name: RABBITMQ_EXCHANGE
              valueFrom:
                configMapKeyRef:
                  name: booking-config
                  key: FLIGHT_RABBITMQ_EXCHANGE
            - name: OPEN_TELEMETRY_SERVICE_NAME
              valueFrom:
                configMapKeyRef:
                  name: booking-config
                  key: FLIGHT_OTEL_SERVICE_NAME
          ports:
            - containerPort: 3344
              name: http
          startupProbe:
            httpGet:
              path: /
              port: 3344
            failureThreshold: 30
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /
              port: 3344
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            httpGet:
              path: /
              port: 3344
            initialDelaySeconds: 30
            periodSeconds: 20
            timeoutSeconds: 5
